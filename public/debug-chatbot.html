<!DOCTYPE html>
<html>
<head>
    <title>Chatbot Debug Test</title>
    <link rel="stylesheet" href="advanced-chatbot.css">
</head>
<body>
    <h1>Chatbot Debug Test</h1>
    <div id="chatbot-container"></div>
    
    <script src="advanced-chatbot.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded, testing chatbot initialization...');
            
            // Check if AdvancedChatBot class is defined
            console.log('AdvancedChatBot class:', typeof AdvancedChatBot);
            
            // Check if container exists
            const container = document.getElementById('chatbot-container');
            console.log('Container found:', container);
            
            if (typeof AdvancedChatBot !== 'undefined' && container) {
                try {
                    console.log('Creating chatbot...');
                    window.testChatbot = new AdvancedChatBot('chatbot-container');
                    console.log('Chatbot created successfully!');
                    
                    // Test if toggle button was created
                    setTimeout(() => {
                        const toggleBtn = document.getElementById('chatbot-toggle');
                        console.log('Toggle button found:', toggleBtn);
                        if (toggleBtn) {
                            console.log('Toggle button styles:', getComputedStyle(toggleBtn));
                            console.log('Toggle button click event listeners:', toggleBtn.onclick);
                        }
                    }, 1000);
                } catch (error) {
                    console.error('Error creating chatbot:', error);
                }
            } else {
                console.error('Prerequisites not met:', {
                    class: typeof AdvancedChatBot,
                    container: !!container
                });
            }
        });
    </script>
</body>
</html>
